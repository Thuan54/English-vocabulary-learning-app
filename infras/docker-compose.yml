services:
  # ---------------------------------------------------------
  # MongoDB Service
  # ---------------------------------------------------------
  mongo:
    image: mongo:7.0
    container_name: tdtt_mongo
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=tdtt

  # ---------------------------------------------------------
  # ML Server Service (Python / FastAPI)
  # ---------------------------------------------------------
  ml_server:
    build:
      context: ../ml_server
      dockerfile: ../infras/Dockerfile.model
    container_name: tdtt_ml_server
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - ../ml_server/.env
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      # Optional: Mount code for live reload during development
      # - ../ml_server:/app
      - huggingface_cache:/root/.cache/huggingface # Cache models to avoid re-downloading
    depends_on:
      - mongo

  # ---------------------------------------------------------
  # Main Server Service (Node.js + React Frontend)
  # ---------------------------------------------------------
  server:
    build:
      context: ..
      dockerfile: infras/Dockerfile.server
    container_name: tdtt_server
    restart: always
    ports:
      - "3000:3000"
    env_file:
      - ../server/.env
    environment:
      - NODE_ENV=production
      - PORT=3000
      - MONGO_URI=mongodb://mongo:27017/tdtt
      - ML_SERVER_URL=http://ml_server:8000
    depends_on:
      - mongo
      - ml_server

volumes:
  mongo_data:
  huggingface_cache: